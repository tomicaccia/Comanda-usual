<title>Comanda Usual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra superior fija con procesos, contenido en columna; tema oscuro fijo para uso prolongado en planta */
:root{
  --bg:#0C0E12; --surface:#14171C; --surface-2:#1B1F26; --surface-3:#232832; --line:#262B34; --line-2:#323845;
  --ink:#E8EBF0; --muted:#8B94A3; --faint:#5F6775;

  --ok:#4FBF85; --ok-soft:rgba(79,191,133,.13); --warn:#E5A74A; --warn-soft:rgba(229,167,74,.14); --late:#F0705F; --late-soft:rgba(240,112,95,.14);
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --d00:#A47CF5; --d01:#F2933A; --d02:#45C27C; --d03:#56BFEA;
  --r:10px; --header-bg:rgba(12,14,18,.88); --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-tema="claro"]{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F0F2F5; --surface-3:#E4E8EE; --line:#DCE1E8; --line-2:#C9D0DA;
  --ink:#141920; --muted:#5A6371; --faint:#8C94A1;
  --accent:#3554D1; --accent-strong:#2A44B3; --accent-ink:#FFFFFF; --accent-soft:rgba(53,84,209,.10);
  --ok:#1C8A55; --ok-soft:rgba(28,138,85,.12); --warn:#A86300; --warn-soft:rgba(168,99,0,.12); --late:#C2352B; --late-soft:rgba(194,53,43,.10);
  --header-bg:rgba(242,244,247,.9); --shadow:rgba(20,25,32,.12);
  --d00:#7B4FD8; --d01:#E07415; --d02:#1F9A57; --d03:#1E93C9;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand h1{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0;line-height:1}
.brand h1::before{content:"";width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));box-shadow:inset 0 0 0 5px var(--surface);border:1.5px solid var(--accent)}
.brand h1 small{font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0}
.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;font:500 13px/1 var(--f-body);border:1px solid transparent;background:none;color:var(--muted);padding:8px 11px;border-radius:8px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;transition:background .12s,color .12s}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button .n{font:500 11px/1 var(--f-mono);color:var(--faint);background:var(--surface-2);padding:3px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
nav.tabs button.on{background:var(--surface-3);color:var(--ink);border-color:var(--line-2)}

main{padding-block:22px 64px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}

.views{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.views button{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:500 12.5px var(--f-body);padding:7px 11px;cursor:pointer}
.views button+button{border-left:1px solid var(--line)}
.views button.on{background:var(--surface-3);color:var(--ink)}
.scan{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.scan .field{flex:1 1 300px;position:relative;min-width:0}
.scan input{width:100%;font:400 14px/1.2 var(--f-body);padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);transition:border-color .12s,background .12s}
.scan input::placeholder{color:var(--faint)}
.scan input:focus{border-color:var(--accent);background:var(--surface-2);outline:none}

.scan select{font:500 13.5px var(--f-body);padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);min-height:42px;max-width:100%}
.scan select.need{border-color:var(--warn);color:var(--warn)}
.hint{font-size:12.5px;color:var(--faint);margin-top:-4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;transition:border-color .12s,background .12s}

.t-body{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.t-row{display:flex;justify-content:space-between;align-items:center;gap:8px}

button.code{cursor:pointer} button.code:hover{color:var(--accent)}
.age{flex:none;font:600 11.5px/1 var(--f-mono);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.ticket.warn .age{background:var(--warn-soft);color:var(--warn)} .ticket.late .age{background:var(--late-soft);color:var(--late)}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.st{font:600 10px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:5px;background:var(--surface-2);color:var(--faint)}
.st.d{background:var(--ok-soft);color:var(--ok)}
.st.p{background:var(--warn-soft);color:var(--warn)}
.t-foot{padding:0 14px 14px;display:flex}
.t-foot button{flex:1;font:600 13.5px/1 var(--f-body);border:0;border-radius:8px;padding:11px;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:filter .12s}
.t-foot button:hover{filter:brightness(1.1)}
.t-foot button:disabled{opacity:.45;cursor:progress}
/* Vista lista: una caja por fila */
.grid.lista{grid-template-columns:1fr;gap:6px}
.grid.lista .ticket{flex-direction:row;align-items:center;border-radius:10px}
.grid.lista .t-body{flex:1;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:10px 14px}
.grid.lista .t-row{flex:0 1 auto;gap:12px}
.grid.lista .meta{flex:1 1 260px}
.grid.lista .steps{flex:0 1 auto}
.grid.lista .t-foot{padding:10px 12px 10px 0;flex:none}
.grid.lista .t-foot button{padding:9px 16px;white-space:nowrap}
@media (max-width:640px){.grid.lista .ticket{flex-direction:column;align-items:stretch}.grid.lista .t-foot{padding:0 12px 12px}}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.empty .btn{margin-top:6px}
.btn{font:500 13px var(--f-body);border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);padding:9px 13px;border-radius:8px;cursor:pointer;transition:background .12s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--late);border-color:var(--late-soft);background:var(--late-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.more{display:flex;justify-content:center}
h3.sub{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 0;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);background:var(--surface);position:sticky;top:0}
td.c{font-family:var(--f-mono);font-weight:600}
td.y{color:var(--ok);font-family:var(--f-mono);font-size:12.5px} td.n{color:var(--faint)} td.na{color:var(--faint);opacity:.4}
td.pp{color:var(--warn);font-weight:600} td.ls{color:var(--accent);font-weight:600}
tbody tr:hover td{background:var(--surface-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.panel textarea{font:500 14px/1.6 var(--f-mono);border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg);color:var(--ink);min-height:180px;width:100%;resize:vertical}
.panel input[type=number],.panel input[type=text]{font:500 14px var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);color:var(--ink);width:160px;max-width:100%;margin-top:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.preview{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.preview .bad{color:var(--late)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2);padding:11px 12px 11px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;font-size:13.5px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 12px 32px var(--shadow)}
.toast button{background:none;border:1px solid var(--line-2);color:var(--accent);border-radius:6px;padding:6px 10px;font:600 12.5px var(--f-body);cursor:pointer}
.toast.err{border-color:var(--late);color:var(--late)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);border-left:1px solid var(--line);width:min(440px,100%);height:100%;overflow-y:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px;display:flex;flex-direction:column;gap:14px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.drawer h2{font:600 17px var(--f-mono);margin:0;word-break:break-all}
.tl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.tl div:last-child{border-bottom:0}
.tl .when{font-family:var(--f-mono);font-size:12.5px;color:var(--ok)}
.tl .pend{color:var(--faint);font-size:12.5px}
.tl small{display:block;color:var(--muted);font-size:12px}

.confirm{background:var(--late-soft);color:var(--late);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.pick{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.pick input{width:17px;height:17px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
.link{align-self:start;background:none;border:0;padding:0;font:500 12px var(--f-body);color:var(--muted);cursor:pointer}
.link:hover{color:var(--accent)}
.grid.lista .link{align-self:center}
.bulk{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 14px}
.bulk .all span{font-weight:500;font-size:13px;color:var(--muted)}
.bulk .btn.primary{padding:9px 16px}
.etapas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.etapas button{display:flex;align-items:center;gap:9px;justify-content:center;flex-wrap:wrap;padding:10px;border:0;border-radius:9px;background:none;color:var(--muted);font:500 13.5px var(--f-body);cursor:pointer;min-width:0;text-align:center}

.etapas button .n{font:500 11px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.etapas button.on{background:var(--surface-3);color:var(--ink)}
.etapas button.on .paso{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.t-tools{display:flex;align-items:center;gap:6px;flex:none}
.info{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--accent);font:600 11px/1 var(--f-mono);cursor:pointer;flex:none}

.ib-head{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.ib-list{display:flex;flex-direction:column;gap:4px}

.ib-row b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:50%;flex:none;background:repeating-linear-gradient(45deg,var(--faint) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);display:inline-block}

.ib-empty{font-size:12.5px;color:var(--faint)}

/* Procesos con tres etapas en una sola pestaña: Lista → En proceso → Terminadas */
const ENS_REQ = ["frentes","patillas","lentillas"];
const GRUPOS = {
  torno: { tab:"torno", n:"Torno", lineas:["receta","sol"], ini:"tornoEnv", fin:"tornoEnt", sust:"torno", lista:"Lista para torno", resp:TORNO, respCol:"Torno", respVerbo:"En",

  ensamblado: { tab:"ensamblado", n:"Ensamblado", lineas:["receta","sol"], ini:"ensEnv", fin:"ensRec", sust:"ensamblado", lista:"Lista para ensamblar", resp:ENSAMB, respCol:"Ensamblador", respVerbo:"Ensambla",
    req: c => (lineaDe(c) === "sol" ? ["frentes","patillas"] : ENS_REQ).find(k=>!done(c,k)) || null, reqTxt:"Para ensamblar necesita Frentes y Patillas (y Lentillas en receta).",

const STAGES = {};

const ETAPA_IDS = ["lista","proceso","terminadas"];
const CLIENTES = {"01":"Mario","02":"Córdoba","03":"D.o.s","04":"Mar del Plata","S1":"Mario","S2":"Córdoba","S3":"D.o.s","S4":"Mar del Plata"};
const RX = /^([A-Z0-9]{2})-(\d{8})-(\d{3})(?:-(\d{1,2}))?$/;
const PAGE = 60;

const S = { tab: "produccion", esAdmin: false, prod: { lunes: "", key: "", doc: null, hechos: new Map(), atrasos: [], loading: true, unsub: null, add: null, edit: null, atr: null }, q: "", cajas: new Map(), loaded: false, stale: false, error: null,

Object.defineProperty(S, "carrito", { get(){ return S.carritos[S.linea]; }, set(v){ S.carritos[S.linea] = v; } });
try { const l = localStorage.getItem("cu.linea"); if (l === "sol" || l === "receta") S.linea = l; } catch(e) {}
S.etapas = {ensamblado:"lista", torno:"lista"}; S.vista = "grilla";
try { const f = localStorage.getItem("cu.fmt"); if (f) S.printFmt = f; } catch(e) {}
try { const v = localStorage.getItem("cu.vista"); if (v === "lista" || v === "grilla") S.vista = v; } catch(e) {}
try { const t = localStorage.getItem("cu.tab"); if (t) S.tab = t; const et = JSON.parse(localStorage.getItem("cu.etapas")||"{}"); for (const k in S.etapas) if (ETAPA_IDS.includes(et[k])) S.etapas[k] = et[k]; const r = JSON.parse(localStorage.getItem("cu.resp")||"{}"); S.resp = r; } catch(e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const done = (c,k) => { if (GRUPOS[k]) k = GRUPOS[k].fin; return !!(c.procesos && c.procesos[k] && c.procesos[k].f); };

function bloqueo(p,c){
  if (p.k === "despacho") return lineaDe(c) === "sol" ? (SOL_REQ.find(k => !done(c,k)) || null) : done(c,"ensRec") ? null : "ensRec";

function rangoRapido(id){
  const h = new Date(); h.setHours(0,0,0,0); const lun = new Date(h); lun.setDate(h.getDate() - ((h.getDay()+6)%7));
  if (id === "semana") return [isoDe(lun), isoDe(h)];
  if (id === "pasada"){ const a = new Date(lun); a.setDate(lun.getDate()-7); const b = new Date(lun); b.setDate(lun.getDate()-1); return [isoDe(a), isoDe(b)]; }

function asegurarReporte(g){

  if (R.key === key) return;

  R.unsub = S.db.collection("registros").where("tipo","==",g.tab).where("f",">=",R.desde).where("f","<=",R.hasta)

function parseAlta(txt, cantDef){

    const code = norm(parts[0]); const rest = parts.slice(1);

    if (rest.length === 1 && /^\d+$/.test(rest[0])) qty = parseInt(rest[0],10);
    else { let nombre = []; for (const t of rest){ if (/^\d+$/.test(t)){ if (nombre.length){ colores.push({color: nombre.join(" ").toLowerCase(), cant: parseInt(t,10)}); nombre = []; } } else nombre.push(t); } }
    if (colores.length) qty = colores.reduce((a,x)=>a+x.cant,0);
    if (qty == null && cantDef) qty = parseInt(cantDef,10);
    const m = RX.exec(code);
    return {code, qty: Number.isFinite(qty)?qty:null, colores, ok: !!m, dup: S.cajas.has(code), m};
  });
}

function leerPedido(XLSX, wb){
  const out = { pedido:null, dist:null, lines:[] };
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:"" });
    let modelo = null;
    for (const row of rows){
      const cells = row.map(v => v == null ? "" : String(v).trim());
      const txt = cells.join(" ");
      if (!out.pedido){ const m = txt.match(/\b([A-Z0-9]{2}-\d{8})\b/i); if (m) out.pedido = m[1].toUpperCase(); }
      const ld = cells.findIndex(v => /n[uú]mero de distribuidor/i.test(v));
      if (ld >= 0){ const v = cells.slice(ld+1).find(x => x); if (v) out.dist = String(v).trim().toUpperCase().padStart(2,"0"); continue; }
      if (/total/i.test(txt)) continue;
      const head = txt.match(/modelo\s+u?s?\s*(\d{1,3})\b/i);
      if (head){ modelo = head[1].padStart(3,"0"); continue; }
      const t1 = cells.findIndex(v => v && !esNum(v));
      if (t1 < 0 || ENCABEZADOS.test(cells[t1]) || /n[uú]mero|pedido|correo|nota/i.test(cells[t1])) continue;
      let t2 = -1; for (let i = t1+1; i < cells.length; i++){ if (cells[i] && !esNum(cells[i])){ t2 = i; break; } if (esNum(cells[i])) break; }
      const desde = t2 >= 0 ? t2 : t1;
      let qty = null; for (let i = desde+1; i < cells.length; i++) if (esNum(cells[i])) qty = Number(String(cells[i]).replace(",","."));
      if (!qty || qty <= 0) continue;
      let mod = modelo; for (let i = t1-1; i >= 0; i--) if (esNum(cells[i])){ mod = String(parseInt(cells[i],10)).padStart(3,"0"); break; }
      if (!mod) continue;
      out.lines.push({ modelo: mod, frente: cells[t1], segundo: t2 >= 0 ? cells[t2] : "", cant: Math.round(qty) });
    }
  }
  if (!out.dist && out.pedido) out.dist = out.pedido.slice(0,2);
  const sol = /^S/i.test(out.pedido || "");
  out.lines = out.lines.map(l => sol ? { modelo: l.modelo, frente: l.frente, patilla: l.frente, cristal: l.segundo, cant: l.cant } : { modelo: l.modelo, frente: l.frente, patilla: l.segundo || l.frente, cant: l.cant });

function armarCajas(lines, cap){

function patchDespacho(it, entry, meta){
  const c = S.cajas.get(it.codigo);
  if (!it.parcial || !c) return { procesos: { despacho: entry }, activa: false, fDesp: entry.f };
  const L = c.colores || [];
  const enviado = L.map((l,i) => ({ ...l, cant: Math.min(Number(l.cant)||0, Number(it.parcial[i])||0) })).filter(l => l.cant > 0);
  const resto = L.map((l,i) => ({ ...l, cant: (Number(l.cant)||0) - Math.min(Number(l.cant)||0, Number(it.parcial[i])||0) })).filter(l => l.cant > 0);
  const parciales = [...(c.parciales || []), { f: entry.f, at: entry.at, remito: entry.remito, bulto: entry.bulto, cliente: meta.cliente || "", lineas: enviado, cant: enviado.reduce((a,l)=>a+l.cant,0), ...(S.uid ? { por: S.uid } : {}) }];
  const base = { parciales, ...(c.colOriginal ? {} : { colOriginal: L, cantOriginal: c.cantidad ?? null }) };
  if (!resto.length) return { ...base, procesos: { despacho: entry }, activa: false, fDesp: entry.f };
  return { ...base, colores: resto, cantidad: resto.reduce((a,l)=>a+l.cant,0), fDespParcial: entry.f };
}
async function confirmarDespacho(){
  if (S.despBusy) return;
  const meta = metaPlanilla(); const L = lineasPlanilla(); const items = S.carrito.items.filter(it => S.cajas.has(it.codigo) && (!it.parcial || unidItem(it) > 0));
  let n = 0; S.despBusy = `0/${items.length}`; render();
  for (const it of items){
    const entry = { f: meta.fecha, at: Date.now(), bulto: it.bulto ?? null, remito: meta.remito || null };
    if (S.uid) entry.por = S.uid;
    try { await S.db.collection("cajas").doc(it.codigo).update(patchDespacho(it, entry, meta)); n++; S.despBusy = `${n}/${items.length}`; render(); }
    catch(e){ failed(e); break; }
  }
  if (n === items.length){
    try { await registrarInsumosDespacho(meta, meta.insumos || []); } catch(e){ failed(e); }
    try { await S.db.collection("planillas").add({ meta, linea: S.linea, lineas: L, cajas: items.map(i=>i.codigo), creada: Date.now(), ...(S.uid?{por:S.uid}:{}) }); } catch(e){}
    await guardarCarrito({ ...CARRITO_VACIO(), bultoActual: 1 });
    const np = items.filter(i => i.parcial && unidItem(i) < (Number(S.cajas.get(i.codigo)?.cantidad)||0)).length;
    S.verPlanilla = false; S.confirmDesp = false; toast(`Se despacharon ${n} cajas${np ? ` (${np} parcial${np===1?"":"es"}: lo que sobra sigue en Listas para despachar)` : ""}. La planilla quedó guardada abajo.`);
  }
  S.despBusy = null; render();
}

/* ---------- Stock de lentes (línea Sol) ---------- */
const BASES = ["B2","B4,5","B6","B8"];
const baseId = b => String(b).replace(",", ".");
const normCol = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
function stockItems(){ return [...S.stock.values()].sort((a,b) => BASES.indexOf(a.base) - BASES.indexOf(b.base) || (a.codigo||0) - (b.codigo||0)); }
function buscarStock(base, color){ const n = normCol(color); return stockItems().find(i => i.base === base && normCol(i.color) === n) || null; }
function movsDe(id){ let t = 0; for (const m of S.movs) for (const l of (m.lineas||[])) if (l.id === id) t += Number(l.cant) || 0; return t; }
function stockActual(it){ return (Number(it.inicial) || 0) + movsDe(it.id); }
function consumoMes(id){ const mes = today().slice(0,7); let t = 0; for (const m of S.movs) if (m.tipo === "calibrado" && String(m.fecha||"").slice(0,7) === mes) for (const l of (m.lineas||[])) if (l.id === id) t -= Number(l.cant) || 0; return t; }
const nfmt = v => (Math.round(v*100)/100).toLocaleString("es-AR");
/* Líneas de lente de una caja de sol: cristal + cantidad */
function lentesCaja(c){ const m = new Map(); for (const x of (c.colores||[])){ const cr = x.cristal || ""; if (!cr) continue; m.set(cr, (m.get(cr)||0) + (Number(x.cant)||0)); } return [...m.entries()].map(([cristal, cant]) => ({ cristal, cant })); }
function coloresLente(){ const m = new Map(); for (const it of S.stock.values()){ const k = normCol(it.color); if (!m.has(k)) m.set(k, it.color); } return [...m.values()].sort((a,b) => a.localeCompare(b, "es")); }
const baseKey = (c, cristal) => c.codigo + "|" + normCol(cristal);
function planConsumo(c){
  return lentesCaja(c).map(l => { const base = S.baseSel[baseKey(c, l.cristal)] || ""; const it = base ? buscarStock(base, l.cristal) : null;
    return { ...l, base, it, antes: it ? stockActual(it) : null, despues: it ? stockActual(it) - l.cant : null }; });
}
async function registrarConsumo(c){
  const plan = planConsumo(c);
  if (!plan.length) throw { code: "sin_lentes", message: `${c.codigo} no tiene cristales cargados. Cargalos en el botón de info.` };
  const sinBase = plan.filter(l => !l.base);
  if (sinBase.length) throw { code: "sin_base", message: `Elegí la base de ${sinBase.map(f=>f.cristal).join(", ")} en ${c.codigo}.` };
  const falta = plan.filter(l => !l.it);
  if (falta.length) throw { code: "sin_item", message: `No hay en el stock: ${falta.map(f=>`${f.cristal} en ${f.base}`).join(", ")}.` };
  const bases = Object.fromEntries(plan.map(l => [l.cristal, l.base]));
  const resumen = [...new Set(plan.map(l => l.base))].join(" / ");
  const ref = S.db.collection("stockMov").doc();
  await ref.set({ tipo: "calibrado", caja: c.codigo, base: resumen, fecha: today(), at: Date.now(), lineas: plan.map(l => ({ id: l.it.id, cant: -l.cant })), ...(S.uid ? { por: S.uid } : {}) });
  return { id: ref.id, resumen, bases };
}
function lentesHTML(c){
  const plan = planConsumo(c);
  if (!plan.length) return `<div class="lentes vacio">Sin cristales cargados. Cargalos con el botón ⓘ.</div>`;
  return `<div class="lentes">${plan.map((l,i) => `<div class="ln"><span>${esc(l.cristal)}</span><b>${l.cant}</b>
    <select class="bsel ${l.base?"":"need"}" id="bs-${esc(c.codigo)}-${i}" data-base="${esc(baseKey(c, l.cristal))}" aria-label="Base para ${esc(l.cristal)}"><option value="">Base…</option>${BASES.map(b=>`<option ${l.base===b?"selected":""}>${esc(b)}</option>`).join("")}</select>
    ${!l.base ? `<small>elegí la base</small>` : !l.it ? `<small class="bad">no hay en ${esc(l.base)}</small>` : `<small class="${l.despues < 0 ? "bad" : ""}">stock ${esc(l.base)}: ${nfmt(l.antes)} → ${nfmt(l.despues)}</small>`}</div>`).join("")}</div>`;
}

        <td><span class="mv"><input type="number" step="0.5" id="mv-${esc(i.id)}" placeholder="Cant." aria-label="Cantidad para ${esc(i.color)} ${esc(b)}"><button class="btn" data-ingreso="${esc(i.id)}" title="Sumar al stock">+ Ingreso</button><button class="btn" data-ajuste="${esc(i.id)}" title="Fijar el stock a este número (conteo real)">Fijar</button></span></td></tr>`; }).join("")}

function nuevoLenteHTML(){

async function manCargar(){

/* ---------- Estadísticas (Receta + Sol) ---------- */
function rangoEst(id){
  const h = new Date(); h.setHours(0,0,0,0);
  if (id === "mes") return [isoDe(new Date(h.getFullYear(), h.getMonth(), 1)), isoDe(h)];
  if (id === "mesant") return [isoDe(new Date(h.getFullYear(), h.getMonth()-1, 1)), isoDe(new Date(h.getFullYear(), h.getMonth(), 0))];
  if (id === "3m") return [isoDe(new Date(h.getFullYear(), h.getMonth()-2, 1)), isoDe(h)];
  if (id === "anio") return [isoDe(new Date(h.getFullYear(), 0, 1)), isoDe(h)];
  return [isoDe(h), isoDe(h)];
}
async function cargarEst(force){
  const E = S.est; if (!S.db) return;
  const campo = E.modo === "despacho" ? "fDesp" : "pedido";
  const key = `${campo}|${E.desde}|${E.hasta}`;
  if (!force && E.key === key) return;
  E.key = key; E.loading = true; E.error = false;
  try { const sn = await S.db.collection("cajas").where(campo, ">=", E.desde).where(campo, "<=", E.hasta).limit(1000).get();
    if (E.key !== key) return;
    E.cajas = sn.docs.map(d => ({ id: d.id, ...d.data() })); E.truncado = sn.size >= 1000; }
  catch(e){ E.error = true; E.cajas = []; }
  E.loading = false; render(true);
}
const distNombre = k => k === "otros" ? "Otros" : `${k} · ${({ "01":"Mario", "02":"Córdoba", "03":"D.o.s", "04":"Mar del Plata" })[k] || ""}`.replace(/ · $/, "");
const distKey = c => { const k = String(c.cliente || String(c.codigo).slice(0,2)).toUpperCase().replace(/^S/, "0"); return /^\d{2}$/.test(k) ? k : "otros"; };
function lineasEst(){
  const out = [];
  for (const c of S.est.cajas || []){
    if (c.cancelada) continue;
    const linea = lineaDe(c); const cal = c.procesos && c.procesos.calibrado; const desp = !!(c.procesos && c.procesos.despacho && c.procesos.despacho.f);
    const ls = (c.colores || []).length ? c.colores : [{ color: "Sin color", cant: c.cantidad || 0 }];
    for (const l of ls){
      const cristal = l.cristal || ""; let base = "";
      if (linea === "sol"){ base = cal ? ((cal.bases && cal.bases[cristal]) || (cal.r && !String(cal.r).includes("/") ? cal.r : "")) : ""; if (!base) base = cal ? "Sin dato" : "Sin calibrar"; }
      out.push({ caja: c.codigo, linea, dist: distKey(c), modelo: String(c.modelo || "—"), color: l.color || "Sin color", cristal, base, cant: Number(l.cant) || 0, desp });
    }
    if (!desp) for (const pa of (c.parciales || [])) for (const l of (pa.lineas || [])){ const cristal = l.cristal || "";
      out.push({ caja: c.codigo, linea, dist: distKey(c), modelo: String(c.modelo || "—"), color: l.color || "Sin color", cristal, base: linea === "sol" ? ((cal && cal.bases && cal.bases[cristal]) || (cal ? "Sin dato" : "Sin calibrar")) : "", cant: Number(l.cant) || 0, desp: true }); }
  }
  return out;
}
function filtrarEst(L, salvo){
  const E = S.est;
  return L.filter(l => (E.linea === "todas" || l.linea === E.linea)
    && (salvo === "dist" || !E.dist || l.dist === E.dist)
    && (salvo === "modelo" || !E.modelo || l.modelo === E.modelo)
    && (salvo === "color" || !E.color || normCol(l.color) === normCol(E.color))
    && (salvo === "lente" || !E.lente || normCol(l.cristal) === normCol(E.lente))
    && (salvo === "base" || !E.base || l.base === E.base));
}
function agrupar(L, campo){ const m = new Map(); for (const l of L){ const k = l[campo] || "—"; const v = m.get(k) || { u: 0, cajas: new Set() }; v.u += l.cant; v.cajas.add(l.caja); m.set(k, v); } return [...m.entries()].map(([k,v]) => ({ k, u: v.u, cajas: v.cajas.size })).sort((a,b) => b.u - a.u); }
function barras(titulo, filas, campo, opts = {}){
  const tope = opts.tope || 12; let rows = filas;
  if (rows.length > tope){ const resto = rows.slice(tope - 1); rows = [...rows.slice(0, tope - 1), { k: `Otros (${resto.length})`, u: resto.reduce((a,r)=>a+r.u,0), cajas: resto.reduce((a,r)=>a+r.cajas,0), otros: true }]; }
  const max = Math.max(1, ...rows.map(r => r.u)); const tot = filas.reduce((a,r)=>a+r.u,0) || 1;
  const sel = S.est[campo];
  return `<section class="pcard est-card"><header><div><b>${esc(titulo)}</b><small>${filas.length} ${esc(opts.unidad || "valores")} · tocá una barra para filtrar</small></div>${sel ? `<button class="btn" data-estclear="${campo}">Quitar filtro</button>` : ""}</header>
    ${!rows.length ? `<div class="dempty">Sin datos con estos filtros</div>` : `<div class="bars" role="list">${rows.map(r => { const pct = r.u / tot * 100; const on = sel && sel === r.k;
      const color = opts.colorDe ? opts.colorDe(r.k) : "";
      return `<button class="bar ${on?"on":""} ${sel && !on ? "dim" : ""}" role="listitem" ${r.otros ? "disabled" : `data-estf="${campo}" data-estv="${esc(r.k)}"`} title="${esc(opts.nombre ? opts.nombre(r.k) : r.k)}: ${r.u} u. en ${r.cajas} caja${r.cajas===1?"":"s"} (${pct.toFixed(1).replace(".",",")}%)">
        <span class="bl">${esc(opts.nombre ? opts.nombre(r.k) : r.k)}</span>
        <span class="bt"><i style="width:${(r.u/max*100).toFixed(2)}%;${color?`background:${color}`:""}"></i></span>
        <span class="bv"><b>${r.u.toLocaleString("es-AR")}</b> <small>${pct.toFixed(0)}%</small></span></button>`; }).join("")}</div>`}
  </section>`;
}
function renderEstadisticas(){
  const E = S.est; cargarEst();

        <span class="views" style="margin-left:auto"><button data-estmodo="pedido" class="${E.modo==="pedido"?"on":""}">Por pedido</button><button data-estmodo="despacho" class="${E.modo==="despacho"?"on":""}">Por despacho</button></span></div>

      ${sel("estDist","dist","Distribuidor",opsDe("dist","dist"),distNombre)}

    <div class="kpis">

const lunesDe = iso => { const [y,m,d] = String(iso).split("-").map(Number); const f = new Date(y, m-1, d); f.setDate(f.getDate() - ((f.getDay()+6)%7)); return isoDe(f); };

function asegurarProd(){
  const P = S.prod; if (!S.db || P.key === P.lunes) return;
  if (P.unsub) P.unsub.forEach(u => { try { u(); } catch(e){} });
  P.key = P.lunes; P.doc = null; P.hechos = new Map(); P.atrasos = []; P.loading = true;
  const lun = P.lunes;
  P.unsub = [
    S.db.doc("produccion/" + lun).onSnapshot(sn => { if (P.key !== lun) return; P.doc = sn.exists ? sn.data() : null; P.loading = false; if (S.tab === "produccion") render(true); }, () => { P.loading = false; P.error = true; render(true); }),
    S.db.collection("prodHecho").where("semana", "==", lun).onSnapshot(sn => { if (P.key !== lun) return; P.hechos = new Map(sn.docs.map(d => [d.data().item, { id: d.id, ...d.data() }])); if (S.tab === "produccion") render(true); }, () => {}),
    S.db.collection("prodAtraso").where("semana", "==", lun).onSnapshot(sn => { if (P.key !== lun) return; P.atrasos = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.at||0) - (b.at||0)); if (S.tab === "produccion") render(true); }, () => {}),

/* ---------- Pago a ensambladores ---------- */
const NO_PAGO = ["Interno", "Stock"];
const redondeo500 = v => Math.ceil(v / 500) * 500;
const pesos = v => "$" + (Math.round(v * 100) / 100).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function asegurarPagos(){
  if (!S.db) return;
  const P = S.pago; const key = `${P.desde}|${P.hasta}`;
  if (P.key === key) return;
  if (P.unsub) P.unsub();
  P.key = key; P.loading = true; P.rows = []; P.error = false;
  P.unsub = S.db.collection("registros").where("tipo","==","ensamblado").where("f",">=",P.desde).where("f","<=",P.hasta)
    .onSnapshot(sn => { P.rows = sn.docs.map(d => ({ id: d.id, ...d.data() })); P.loading = false; render(true); }, () => { P.loading = false; P.error = true; render(true); });
}
function calcPagos(){
  const P = S.pago; const pr = S.precios;
  const m = new Map();
  for (const n of ENSAMB) if (!NO_PAGO.includes(n)) m.set(n, { receta: 0, sol: 0, cajasR: 0, cajasS: 0 });
  for (const r of P.rows){ const n = r.r || "Sin asignar"; if (NO_PAGO.includes(n)) continue;
    const v = m.get(n) || { receta: 0, sol: 0, cajasR: 0, cajasS: 0 };
    if ((r.linea || "receta") === "sol"){ v.sol += Number(r.cant)||0; v.cajasS++; } else { v.receta += Number(r.cant)||0; v.cajasR++; }
    m.set(n, v); }
  return [...m.entries()].map(([n, v]) => { const impR = v.receta * pr.receta, impS = v.sol * pr.sol, tot = impR + impS;
    return { n, ...v, impR, impS, tot, red: redondeo500(tot) }; })
    .sort((a,b) => b.tot - a.tot || a.n.localeCompare(b.n));
}

function xlsxPagos(){

  const last = filas.length + 2, t = last + 1;

  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="22" customWidth="1"/><col min="2" max="9" width="15" customWidth="1"/></cols><sheetData>${rows.join("")}</sheetData></worksheet>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="10"/><name val="Arial"/></font><font><b/><sz val="10"/><name val="Arial"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="2"><border/><border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="3"><xf/><xf borderId="1" applyBorder="1"/><xf fontId="1" borderId="1" applyFont="1" applyBorder="1"/></cellXfs></styleSheet>`;
  return zipStore([
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Pago" sheetId="1" r:id="rId1"/></sheets><calcPr fullCalcOnLoad="1"/></workbook>`],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/worksheets/sheet1.xml", sheet], ["xl/styles.xml", styles] ]);

async function terminar(codigo, k){
  const p = proc(k); const c = S.cajas.get(codigo);
  if (!S.db || !c || S.busy.has(codigo)) return;
  if (p.resp && !S.resp[k]){ toast(k==="calibrado"?"Elegí la base antes de calibrar.":"Elegí el responsable antes de terminar.", null, true); const r=$("#resp"); if(r) r.focus(); return; }
  const entry = { f: today(), at: Date.now() };
  if (p.resp) entry.r = S.resp[k];
  if (S.uid) entry.por = S.uid;
  const patch = { procesos: { [k]: entry } };
  if (k === "despacho") patch.activa = false;
  S.busy.add(codigo); render(true);
  try {
    if (k === "calibrado"){ const rc = await registrarConsumo(c); entry.mov = rc.id; entry.r = rc.resumen; entry.bases = rc.bases; }
    const regRef = STAGES[k] && STAGES[k].etapa === "proceso" ? S.db.collection("registros").doc() : null; if (regRef) entry.reg = regRef.id;
    try { await S.db.collection("cajas").doc(codigo).update(patch); } catch(e){ if (entry.mov) await S.db.collection("stockMov").doc(entry.mov).delete().catch(()=>{}); throw e; }
    if (regRef) await regRef.set(registroDe(c, k, entry)).catch(()=>{});
    const hora = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    S.recent.unshift({codigo, k, hora, r: entry.r});
    S.recent = S.recent.slice(0,40);
    toast(`<b>${esc(codigo)}</b> ${p.accion?esc(p.accion):"terminada en "+esc(p.n)}`, () => deshacer(codigo, k, false, entry.mov, entry.reg));
  } catch(e){ failed(e); }
  finally { S.busy.delete(codigo); if (S.q && norm(S.q)===codigo) S.q=""; render(true); }
}
async function terminarVarias(k, lista){
  const p = proc(k);
  if (!S.db || S.bulkBusy) return;
  if (p.resp && !S.resp[k]){ toast(k==="calibrado"?"Elegí la base antes de calibrar.":"Elegí el responsable antes de terminar.", null, true); const r=$("#resp"); if(r) r.focus(); return; }
  const codes = (lista || [...S.sel]).filter(id => S.cajas.has(id));
  if (!codes.length) return;
  const hecho = [];
  S.bulkBusy = `0/${codes.length}`; render(true);
  for (const codigo of codes){
    const entry = { f: today(), at: Date.now() };
    if (p.resp) entry.r = S.resp[k];
    if (S.uid) entry.por = S.uid;
    const patch = { procesos: { [k]: entry } };
    if (k === "despacho") patch.activa = false;
    try { if (k === "calibrado"){ const rc = await registrarConsumo(S.cajas.get(codigo)); entry.mov = rc.id; entry.r = rc.resumen; entry.bases = rc.bases; }
      const regRef = STAGES[k] && STAGES[k].etapa === "proceso" ? S.db.collection("registros").doc() : null; if (regRef) entry.reg = regRef.id;
      try { await S.db.collection("cajas").doc(codigo).update(patch); } catch(e){ if (entry.mov) await S.db.collection("stockMov").doc(entry.mov).delete().catch(()=>{}); throw e; }
      if (regRef) await regRef.set(registroDe(S.cajas.get(codigo), k, entry)).catch(()=>{});
      hecho.push(codigo); S.sel.delete(codigo);
      const hora = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});

  }
  S.recent = S.recent.slice(0,60); S.bulkBusy = null; render(true);
  if (hecho.length) toast(p.accion ? `${hecho.length} caja${hecho.length===1?"":"s"}: ${esc(p.accion)}` : `${hecho.length} caja${hecho.length===1?"":"s"} terminada${hecho.length===1?"":"s"} en ${esc(p.n)}`, async () => { for (const c of hecho) await deshacer(c, k, true); toast(`Se deshicieron ${hecho.length} cajas`); });
}
function registroDe(c, k, entry){ const g = STAGES[k].grupo; return { tipo: g.tab, caja: c.codigo, r: (c.procesos && c.procesos[g.ini] && c.procesos[g.ini].r) || "", cant: c.cantidad ?? null, linea: lineaDe(c), modelo: c.modelo || "", f: entry.f, at: entry.at, ...(S.uid ? { por: S.uid } : {}) }; }

async function crearCajas(rows){
  let n = 0;
  for (const r of rows){
    const m = r.m; const y = m[2];
    const doc = { codigo:r.code, cliente:m[1], pedido:`${y.slice(0,4)}-${y.slice(4,6)}-${y.slice(6)}`, modelo:m[3], nro:m[4]||"", cantidad:r.qty, colores:r.colores||[], procesos:{}, activa:true, origen:"app", creada:Date.now() };
    if (S.uid) doc.creadaPor = S.uid;
    try { await S.db.collection("cajas").doc(r.code).set(doc); S.cajas.set(r.code, doc); n++; } catch(e){ failed(e); break; }
  }
  return n;
}
function failed(e){
  const code = e && e.code;
  if (code === "sin_item" || code === "sin_lentes" || code === "sin_base"){ toast(esc(e.message), null, true); return; }
  if (code === "invalid_argument"){ S.canWrite = false; toast("No tenés permiso para modificar. Pedile al dueño acceso de Colaborador.", null, true); }
  else if (code === "quota_exceeded") toast("La base llegó a su límite de cajas. Avisá para archivar las despachadas.", null, true);
  else toast("No se pudo guardar. Probá de nuevo en unos segundos.", null, true);
}

  for (const lin of ["receta","sol"]) db.doc(carritoPath(lin)).onSnapshot(sn => { if (sn.exists){ const d = sn.data(); S.carritos[lin] = { ...CARRITO_VACIO(), ...d, items: [...(d.items||[])], cats: { ...(d.cats||{}) } }; render(true); } }, () => {});
  db.collection("stock").onSnapshot(sn => { S.stock = new Map(sn.docs.map(d => [d.id, { id: d.id, ...d.data() }])); render(true); }, () => {});
  db.doc("config/precios").onSnapshot(sn => { if (sn.exists){ const d = sn.data(); S.precios = { receta: Number(d.receta) || 0, sol: Number(d.sol) || 0 }; render(true); } }, () => {});
  db.collection("insumos").onSnapshot(sn => { S.insumos = new Map(sn.docs.map(d => [d.id, { id: d.id, ...d.data() }])); render(true); }, () => {});
  db.collection("insumoMov").onSnapshot(sn => { S.insMovs = sn.docs.map(d => ({ id: d.id, ...d.data() })); render(true); }, () => {});
  db.collection("stockMov").onSnapshot(sn => { S.movs = sn.docs.map(d => ({ id: d.id, ...d.data() })); render(true); }, () => {});
  db.collection("planillas").orderBy("creada","desc").limit(8).onSnapshot(sn => { S.planillas = sn.docs.map(d => ({ id: d.id, ...d.data() })); render(true); }, () => {});
  db.collection("cajas").where("activa","==",true).onSnapshot(snap => {
    for (const ch of snap.docChanges()){
      const id = ch.doc.id;
      if (ch.type === "removed") S.cajas.delete(id); else S.cajas.set(id, ch.doc.data());
    }
    if (!snap.metadata.fromCache){ clearTimeout(timer); S.stale = false; }
    S.loaded = true; S.error = null; render(true);
  }, err => { clearTimeout(timer); S.loaded = true; S.error = err && err.code === "revoked" ? "Acceso retirado" : "Se perdió la conexión. Recargá la página."; render(true); });
}
start();
})();
</script>
